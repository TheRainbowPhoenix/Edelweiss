name: EX-word Edelweiss
on:
  push:
    branches: [edelweiss]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: edelweiss-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check C formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install clang-format==21.1.8
          mapfile -t sources < <(git ls-files '*.c' '*.h')
          clang-format --dry-run --Werror "${sources[@]}"
  host-elf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate firmware profiles, ELF loading and relocation
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror exword/elf.c tests/elf_test.c -o /tmp/test-elf
          /tmp/test-elf
          cc -std=c11 -Wall -Wextra -Werror exword/firmware.c tests/firmware_test.c -o /tmp/test-firmware
          /tmp/test-firmware
          cc -std=c11 -Wall -Wextra -Werror exword/elf.c tests/relocation_test.c -o /tmp/test-relocation
          /tmp/test-relocation
  host-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise allocator-owned MMU mapping and teardown
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror exword/memory.c tests/memory_test.c -o /tmp/test-memory
          /tmp/test-memory
          cc -std=c11 -Wall -Wextra -Werror exword/scratch.c tests/scratch_test.c -o /tmp/test-scratch
          /tmp/test-scratch
          cc -std=c11 -Wall -Wextra -Werror exword/read_cache.c tests/read_cache_test.c -o /tmp/test-cache
          /tmp/test-cache
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/therainbowphoenix/gint-docker:main
    steps:
      - uses: actions/checkout@v4
      - name: Check ELF parser, loading and filesystem discovery
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror exword/elf.c tests/elf_test.c -o /tmp/test-elf
          /tmp/test-elf
          cc -std=c11 -Wall -Wextra -Werror exword/firmware.c tests/firmware_test.c -o /tmp/test-firmware
          /tmp/test-firmware
          cc -std=c11 -Wall -Wextra -Werror exword/elf.c tests/relocation_test.c -o /tmp/test-relocation
          /tmp/test-relocation
          cc -std=c11 -Wall -Wextra -Werror exword/scratch.c tests/scratch_test.c -o /tmp/test-scratch
          /tmp/test-scratch
          cc -std=c11 -Wall -Wextra -Werror exword/read_cache.c tests/read_cache_test.c -o /tmp/test-cache
          /tmp/test-cache
          cc -std=c11 -Wall -Wextra -Werror -Itests/mock \
            '-DEDL_APPID="EDELW"' -DEDL_ARENA_START=0x8c700000 -DEDL_ARENA_END=0x8c7f0000 \
            exword/fs.c exword/paths.c exword/elf.c exword/memory.c tests/fs_test.c -o /tmp/test-fs
          /tmp/test-fs
          cc -std=c11 -D_DEFAULT_SOURCE -Wall -Wextra -Werror \
            -Dopen=edl_test_open -Dclose=edl_test_close -Dread=edl_test_read \
            -Dwrite=edl_test_write -Dlseek=edl_test_lseek -Dfstat=edl_test_fstat \
            -Dstat=edl_test_stat sdk/gint_fs.c tests/gint_fs_test.c -o /tmp/test-gint-fs
          /tmp/test-gint-fs
          cc -std=c11 -Wall -Wextra -Werror -Itests/mock \
            -Dmain=payload_main -D_Exit=edl_test_Exit -Dabort=edl_test_abort -Dexit=edl_test_exit \
            -Dedl_entry=edl_test_entry -c sdk/gint_start.c -o /tmp/gint-start.o
          cc -std=c11 -fno-toplevel-reorder -Wall -Wextra -Werror -Itests/mock \
            /tmp/gint-start.o tests/gint_start_test.c -o /tmp/test-gint-start
          /tmp/test-gint-start
          cc -std=c11 -Wall -Wextra -Werror exword/elf.c tests/check_edl.c -o /tmp/check-edl
          python3 tools/generate_assets.py /tmp/edl-assets
          python3 tests/assets_test.py
          cc -std=c11 -Wall -Wextra -Werror payloads/calendar.c tests/calendar_test.c -o /tmp/test-calendar
          /tmp/test-calendar
          cc -std=c11 -Wall -Wextra -Werror -Isdk -I/tmp/edl-assets \
            payloads/ebrew.c payloads/calendar.c payloads/splash.c \
            /tmp/edl-assets/wallpaper.c /tmp/edl-assets/splash.c tests/payload_test.c -o /tmp/test-payload
          /tmp/test-payload 0
          /tmp/test-payload 1
          /tmp/test-payload 2
          /tmp/test-payload 3
          cc -std=c11 -shared -fPIC -Os -Isdk -I/tmp/edl-assets \
            payloads/ebrew.c payloads/calendar.c payloads/splash.c \
            /tmp/edl-assets/wallpaper.c /tmp/edl-assets/splash.c -o /tmp/ebrew-preview.so
          python3 tools/preview.py /tmp/ebrew-preview.so build-preview/ebrew.png
      - name: Install EX-word fxSDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch exword \
            https://github.com/TheRainbowPhoenix/fxsdk-exword.git /tmp/fxsdk-src
          cmake -S /tmp/fxsdk-src -B /tmp/fxsdk-build \
            -DCMAKE_INSTALL_PREFIX=/tmp/fxsdk-exword \
            -DFXLINK_DISABLE_SDL2=ON -DFXLINK_DISABLE_UDISKS2=ON
          cmake --build /tmp/fxsdk-build --parallel 2
          cmake --install /tmp/fxsdk-build
          git clone --depth=1 https://github.com/brijohn/elf2d01.git /tmp/elf2d01
          cc -O2 /tmp/elf2d01/elf2d01.c -o /tmp/fxsdk-exword/bin/elf2d01
          echo /tmp/fxsdk-exword/bin >> "$GITHUB_PATH"
      - name: Install EX-word gint runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch exword \
            https://github.com/TheRainbowPhoenix/gint-exword.git /tmp/gint-src
          cmake -S /tmp/gint-src -B /tmp/gint-build \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/fxsdk-exword/lib/cmake/fxsdk/EXWORD.cmake \
            -DCMAKE_INSTALL_PREFIX=/tmp/gint-exword \
            -DCMAKE_MODULE_PATH=/tmp/fxsdk-exword/lib/cmake/fxsdk
          cmake --build /tmp/gint-build --parallel 2
          cmake --install /tmp/gint-build
      - name: Build stage 0, ELF programs and JP/CN packages
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/TheRainbowPhoenix/exword-xd-a8500-TEST.git /tmp/exword-metadata
          cmake -S . -B build-exword \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/fxsdk-exword/lib/cmake/fxsdk/EXWORD.cmake \
            -DCMAKE_PREFIX_PATH=/tmp/gint-exword \
            '-DCMAKE_MODULE_PATH=/tmp/gint-exword/lib/cmake/fxsdk;/tmp/fxsdk-exword/lib/cmake/fxsdk' \
            -DEXWORD_METADATA_SOURCE=/tmp/exword-metadata
          cmake --build build-exword --parallel 2
          sh-elf-readelf -r build-exword/EBrew.edl | head -60 || true
          /tmp/check-edl build-exword/EBrew.edl build-exword/large-demo.edl
          python3 tools/check_packages.py build-exword
          sh-elf-objdump -d --disassemble=_edl_invoke build-exword/edelweiss
      - uses: actions/upload-artifact@v4
        with:
          name: Edelweiss-ja
          path: build-exword/packages/ja/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Edelweiss-cn
          path: build-exword/packages/cn/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Edelweiss-SDK
          path: |
            sdk/
            docs/EDL-ABI.md
      - uses: actions/upload-artifact@v4
        with:
          name: EBrew-preview
          path: build-preview/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Edelweiss-debug
          path: |
            build-exword/edelweiss
            build-exword/*.edl
            build-exword/exword/*.map
            build-exword/exword/edl.ld
          if-no-files-found: warn
